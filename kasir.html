<!DOCTYPE html>
<html lang="id" class="h-full bg-stone-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Velaro POS - Kasir Mobile</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fdf8f6', 500: '#8c593b', 600: '#7a4a2e', 700: '#633922', 900: '#3d2010' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body x-data="kasirApp()" x-init="initApp()" class="text-stone-100 font-sans h-full flex flex-col antialiased">

  <!-- HEADER MOBILE KASIR -->
  <header class="bg-stone-950 border-b border-stone-800 p-3.5 sticky top-0 z-40 flex justify-between items-center">
    <div class="flex items-center space-x-2.5">
      <img src="velaro-coffe.png" alt="Velaro Logo" class="h-8 w-auto object-contain rounded-md">
      <div>
        <h1 class="font-bold text-white text-xs leading-none">VELARO POS</h1>
        <p class="text-[9px] text-stone-400 mt-0.5">Kasir System</p>
      </div>
    </div>

    <button @click="loadOrders()" class="px-2.5 py-1.5 bg-stone-800 hover:bg-stone-700 rounded-lg text-[10px] font-bold text-stone-300 flex items-center space-x-1 active:scale-95 transition">
      <i data-lucide="refresh-cw" class="w-3 h-3"></i>
      <span>Refresh</span>
    </button>
  </header>

  <!-- CONTENT MAIN (MOBILE CARD VIEW) -->
  <main class="flex-1 p-3 space-y-3 overflow-y-auto max-w-md mx-auto w-full">
    
    <div class="flex justify-between items-center px-1">
      <h2 class="text-xs font-bold text-stone-300">Pesanan Masuk (Real-time)</h2>
      <span class="text-[10px] bg-brand-900/60 text-brand-300 border border-brand-700/50 px-2 py-0.5 rounded-full font-bold" x-text="orders.length + ' Pesanan'"></span>
    </div>

    <template x-if="orders.length === 0">
      <div class="text-center py-12 bg-stone-950 rounded-2xl border border-stone-800 p-6 space-y-2">
        <p class="text-xs text-stone-500 font-medium">Belum ada pesanan masuk.</p>
      </div>
    </template>

    <!-- LIST CARDS DARI PESANAN (DESAIN RESPONSIVE KHUSUS LAYAR HP) -->
    <div class="space-y-3">
      <template x-for="order in orders" :key="order.id">
        <div class="bg-stone-950 border border-stone-800 rounded-2xl p-4 space-y-3 shadow-md">
          
          <!-- Header Order Card -->
          <div class="flex justify-between items-start border-b border-stone-800/80 pb-2.5">
            <div>
              <span class="text-[10px] font-bold text-brand-400" x-text="order.id"></span>
              <h3 class="text-sm font-black text-white" x-text="order.customerName"></h3>
              <p class="text-[9px] text-stone-400" x-text="new Date(order.date).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'})"></p>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[9px] font-extrabold uppercase bg-amber-950/80 text-amber-400 border border-amber-800" x-text="order.status"></span>
          </div>

          <!-- Detail Items -->
          <div class="space-y-1.5 py-1">
            <template x-for="item in order.items" :key="item.name">
              <div class="flex justify-between text-xs text-stone-300">
                <span x-text="item.qty + 'x ' + item.name"></span>
                <span class="text-stone-400" x-text="formatRupiah(item.price * item.qty)"></span>
              </div>
            </template>
          </div>

          <!-- Total & Actions Button -->
          <div class="border-t border-stone-800/80 pt-2.5 flex justify-between items-center">
            <div>
              <span class="text-[9px] text-stone-500 block font-semibold">Total</span>
              <span class="text-xs font-black text-emerald-400" x-text="formatRupiah(order.total)"></span>
            </div>

            <!-- Tombol Aksi Kasir -->
            <div class="flex space-x-1.5">
              <button @click="updateStatus(order.id, 'Diproses Barista')" class="px-3 py-1.5 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-xl text-[10px] font-bold hover:bg-blue-600 hover:text-white active:scale-95 transition">
                Proses
              </button>
              <button @click="updateStatus(order.id, 'Siap Diambil')" class="px-3 py-1.5 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-xl text-[10px] font-bold hover:bg-emerald-600 hover:text-white active:scale-95 transition">
                Siap
              </button>
            </div>
          </div>

        </div>
      </template>
    </div>

  </main>

  <script>
    function kasirApp() {
      return {
        orders: [],

        initApp() {
          this.loadOrders();
          window.addEventListener('storage', (e) => {
            if (e.key === 'velaro_shared_orders') {
              this.loadOrders();
            }
          });
          this.$nextTick(() => lucide.createIcons());
        },

        loadOrders() {
          this.orders = JSON.parse(localStorage.getItem('velaro_shared_orders')) || [];
        },

        updateStatus(orderId, newStatus) {
          let allOrders = JSON.parse(localStorage.getItem('velaro_shared_orders')) || [];
          let target = allOrders.find(o => o.id === orderId);
          if (target) {
            target.status = newStatus;
            localStorage.setItem('velaro_shared_orders', JSON.stringify(allOrders));
            this.orders = allOrders;
          }
        },

        formatRupiah(val) {
          return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
        }
      }
    }
  </script>
</body>
</html>
