<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velaro Coffee - Order Online</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fdf8f6', 100: '#f2e8e5', 500: '#8c593b', 600: '#7a4a2e', 700: '#633922', 900: '#3d2010', 950: '#241108'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body x-data="customerApp()" x-init="initApp()" class="bg-stone-50 text-stone-800 font-sans h-full flex flex-col">

  <!-- HEADER NAV -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-stone-200">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div @click="activePage = 'home'" class="flex items-center space-x-3 cursor-pointer">
        <img src="images/velaro-coffe.png" alt="Velaro Coffee Logo" class="h-10 w-auto object-contain rounded-lg">
        <div>
          <h1 class="font-black text-stone-900 tracking-wider text-sm leading-none">VELARO</h1>
          <p class="text-[9px] text-brand-600 font-bold uppercase tracking-widest mt-0.5">Your Coffee, Your Moment</p>
        </div>
      </div>

      <nav class="hidden md:flex items-center space-x-8 text-xs font-bold uppercase">
        <button @click="activePage = 'home'" :class="activePage === 'home' ? 'text-brand-600' : 'text-stone-500'">Home</button>
        <button @click="activePage = 'menu'" :class="activePage === 'menu' ? 'text-brand-600' : 'text-stone-500'">Menu</button>
        <button @click="activePage = 'orders'" :class="activePage === 'orders' ? 'text-brand-600' : 'text-stone-500'">Pesanan Saya</button>
      </nav>

      <div class="flex items-center space-x-3">
        <button @click="activePage = 'cart'" class="relative p-2 text-stone-600 hover:text-brand-600">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span x-show="cartTotalItems > 0" class="absolute top-1 right-1 bg-brand-600 text-white text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center" x-text="cartTotalItems"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 pb-20 md:pb-10">
    
    <!-- HOME PAGE -->
    <div x-show="activePage === 'home'" x-cloak class="space-y-10">
      <section class="bg-gradient-to-b from-brand-950 to-brand-900 text-white py-16 px-4 text-center space-y-4">
        <img src="images/velaro-coffe.png" class="w-24 h-24 mx-auto object-contain drop-shadow-lg mb-2">
        <h2 class="text-3xl font-black">Nikmati Kopi Favoritmu Tanpa Antre</h2>
        <p class="text-stone-300 text-xs max-w-md mx-auto">Pesan online sekarang, pilih pickup atau delivery secara mudah.</p>
        <button @click="activePage = 'menu'" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-2xl text-xs shadow-lg">Pesan Sekarang</button>
      </section>

      <section class="max-w-5xl mx-auto px-4 space-y-4">
        <h3 class="text-lg font-bold">Menu Populer</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <template x-for="p in products" :key="p.id">
            <div @click="addToCart(p)" class="bg-white border border-stone-200 rounded-2xl p-3 cursor-pointer hover:shadow-lg transition">
              <img :src="p.image" class="w-full h-28 object-cover rounded-xl mb-2">
              <h4 class="font-bold text-xs" x-text="p.name"></h4>
              <p class="text-[10px] text-stone-400" x-text="p.category"></p>
              <div class="flex justify-between items-center mt-2">
                <span class="text-xs font-black text-brand-700" x-text="formatRupiah(p.price)"></span>
                <span class="w-6 h-6 rounded-lg bg-brand-100 text-brand-700 flex items-center justify-center font-bold text-xs">+</span>
              </div>
            </div>
          </template>
        </div>
      </section>
    </div>

    <!-- MENU PAGE -->
    <div x-show="activePage === 'menu'" x-cloak class="max-w-5xl mx-auto px-4 pt-6 space-y-4">
      <h3 class="text-lg font-bold">Katalog Menu</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <template x-for="p in products" :key="p.id">
          <div @click="addToCart(p)" class="bg-white border border-stone-200 rounded-2xl p-3 cursor-pointer hover:shadow-lg transition">
            <img :src="p.image" class="w-full h-28 object-cover rounded-xl mb-2">
            <h4 class="font-bold text-xs" x-text="p.name"></h4>
            <div class="flex justify-between items-center mt-2">
              <span class="text-xs font-black text-brand-700" x-text="formatRupiah(p.price)"></span>
              <button class="px-2 py-1 bg-brand-600 text-white rounded-lg text-[10px] font-bold">+ Tambah</button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- CART PAGE WITH NAME INPUT -->
    <div x-show="activePage === 'cart'" x-cloak class="max-w-xl mx-auto px-4 pt-6 space-y-4">
      <h3 class="text-lg font-bold">Keranjang Pesanan</h3>
      <template x-if="cart.length === 0">
        <div class="text-center py-10 bg-white rounded-2xl border p-6">
          <p class="text-xs text-stone-400">Keranjang masih kosong.</p>
          <button @click="activePage = 'menu'" class="mt-2 text-xs font-bold text-brand-600">Pilih Menu</button>
        </div>
      </template>

      <template x-if="cart.length > 0">
        <div class="space-y-4">
          <!-- Input Nama Pemesan -->
          <div class="bg-white border rounded-2xl p-4 space-y-2">
            <label class="block text-xs font-bold text-stone-700">Nama Pemesan <span class="text-red-500">*</span></label>
            <input type="text" x-model="customerName" placeholder="Masukkan nama Anda (contoh: Budi)" class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:border-brand-600">
            <p class="text-[10px] text-stone-400">Nama ini akan dipanggil oleh kasir saat pesanan siap.</p>
          </div>

          <template x-for="(item, idx) in cart" :key="idx">
            <div class="bg-white border rounded-2xl p-3 flex justify-between items-center">
              <div>
                <h4 class="font-bold text-xs" x-text="item.name"></h4>
                <p class="text-[10px] text-brand-700 font-bold" x-text="formatRupiah(item.price)"></p>
              </div>
              <div class="flex items-center space-x-2">
                <button @click="updateQty(idx, -1)" class="w-6 h-6 bg-stone-100 rounded font-bold text-xs">-</button>
                <span class="text-xs font-bold" x-text="item.qty"></span>
                <button @click="updateQty(idx, 1)" class="w-6 h-6 bg-stone-100 rounded font-bold text-xs">+</button>
              </div>
            </div>
          </template>

          <div class="bg-white border rounded-2xl p-4 space-y-2">
            <div class="flex justify-between text-xs font-bold"><span>Total</span><span class="text-brand-700" x-text="formatRupiah(cartSubtotal)"></span></div>
            <button @click="checkout()" class="w-full py-3 bg-brand-600 text-white font-bold rounded-xl text-xs">Checkout & Bayar (QRIS)</button>
          </div>
        </div>
      </template>
    </div>

    <!-- ORDERS PAGE -->
    <div x-show="activePage === 'orders'" x-cloak class="max-w-xl mx-auto px-4 pt-6 space-y-4">
      <h3 class="text-lg font-bold">Status Pesanan Saya</h3>
      <template x-for="order in customerOrders" :key="order.id">
        <div class="bg-white border rounded-2xl p-4 space-y-3 shadow-sm">
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <p class="text-xs font-bold" x-text="order.id"></p>
              <p class="text-[11px] font-semibold text-brand-700" x-text="'Pemesan: ' + order.customerName"></p>
              <p class="text-[10px] text-stone-400" x-text="new Date(order.date).toLocaleTimeString('id-ID')"></p>
            </div>
            <span class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full text-[10px] font-bold uppercase" x-text="order.status"></span>
          </div>
          <div class="text-xs space-y-1">
            <template x-for="i in order.items" :key="i.name">
              <div class="flex justify-between text-stone-600">
                <span x-text="i.qty + 'x ' + i.name"></span>
                <span x-text="formatRupiah(i.price * i.qty)"></span>
              </div>
            </template>
          </div>
          <div class="border-t pt-2 flex justify-between font-bold text-xs">
            <span>Total Pembayaran</span>
            <span class="text-brand-700" x-text="formatRupiah(order.total)"></span>
          </div>
        </div>
      </template>
    </div>

  </main>

  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t px-6 py-2 flex justify-around text-[10px] font-bold text-stone-500 z-40">
    <button @click="activePage = 'home'" :class="activePage === 'home' ? 'text-brand-600' : ''">Home</button>
    <button @click="activePage = 'menu'" :class="activePage === 'menu' ? 'text-brand-600' : ''">Menu</button>
    <button @click="activePage = 'orders'" :class="activePage === 'orders' ? 'text-brand-600' : ''">Pesanan Saya</button>
  </nav>

  <script>
    function customerApp() {
      return {
        activePage: 'home',
        customerName: '',
        cart: [],
        customerOrders: [],
        products: [
          { id: 1, name: 'Espresso', price: 18000, category: 'Coffee', image: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=400' },
          { id: 2, name: 'Americano', price: 20000, category: 'Coffee', image: 'https://images.unsplash.com/photo-1551030173-122aabc4489c?w=400' },
          { id: 3, name: 'Cappuccino', price: 25000, category: 'Coffee', image: 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=400' },
          { id: 4, name: 'Cafe Latte', price: 25000, category: 'Coffee', image: 'https://images.unsplash.com/photo-1534778101976-62847782c213?w=400' }
        ],

        initApp() {
          this.loadOrders();
          window.addEventListener('storage', (e) => {
            if (e.key === 'velaro_shared_orders') {
              this.loadOrders();
            }
          });
          this.$nextTick(() => lucide.createIcons());
        },

        loadOrders() {
          this.customerOrders = JSON.parse(localStorage.getItem('velaro_shared_orders')) || [];
        },

        get cartTotalItems() { return this.cart.reduce((s, i) => s + i.qty, 0); },
        get cartSubtotal() { return this.cart.reduce((s, i) => s + (i.price * i.qty), 0); },

        addToCart(product) {
          const item = this.cart.find(i => i.id === product.id);
          if (item) item.qty++;
          else this.cart.push({ ...product, qty: 1 });
          alert('Ditambahkan ke keranjang!');
        },

        updateQty(idx, delta) {
          this.cart[idx].qty += delta;
          if (this.cart[idx].qty <= 0) this.cart.splice(idx, 1);
        },

        checkout() {
          if (!this.customerName.trim()) {
            alert('Harap isi Nama Pemesan terlebih dahulu!');
            return;
          }

          const newOrder = {
            id: 'VC-' + Date.now().toString().slice(-5),
            customerName: this.customerName,
            items: [...this.cart],
            total: this.cartSubtotal,
            status: 'Pesanan Diterima',
            date: new Date()
          };

          let allOrders = JSON.parse(localStorage.getItem('velaro_shared_orders')) || [];
          allOrders.unshift(newOrder);
          localStorage.setItem('velaro_shared_orders', JSON.stringify(allOrders));

          this.cart = [];
          this.customerOrders = allOrders;
          this.activePage = 'orders';
          alert(`Pembayaran Berhasil atas nama ${this.customerName}! Pesanan Anda dikirim ke kasir.`);
        },

        formatRupiah(val) {
          return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
        }
      }
    }
  </script>
</body>
</html>
