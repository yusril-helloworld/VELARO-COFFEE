<!DOCTYPE html>
<html lang="id" class="h-full bg-stone-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Velaro Coffee - Order Online</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fdf8f6', 100: '#f2e8e5', 500: '#8c593b', 600: '#7a4a2e', 700: '#633922', 900: '#3d2010', 950: '#241108'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body x-data="customerApp()" x-init="initApp()" class="text-stone-800 font-sans h-full flex flex-col antialiased selection:bg-brand-500 selection:text-white">

  <!-- HEADER MOBILE STICKY -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-stone-200">
    <div class="px-4 h-14 flex items-center justify-between">
      <div @click="activePage = 'home'" class="flex items-center space-x-2.5 cursor-pointer">
        <img src="images/velaro-coffe.png" alt="Velaro Logo" class="h-8 w-auto object-contain rounded-md">
        <div>
          <h1 class="font-black text-stone-900 tracking-wider text-xs leading-none">VELARO</h1>
          <p class="text-[8px] text-brand-600 font-bold uppercase tracking-widest mt-0.5">Your Coffee, Your Moment</p>
        </div>
      </div>

      <!-- Icon Keranjang Top Bar -->
      <button @click="activePage = 'cart'" class="relative p-2 text-stone-700 hover:text-brand-600 active:scale-95 transition">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span x-show="cartTotalItems > 0" class="absolute top-1 right-1 bg-brand-600 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center ring-2 ring-white" x-text="cartTotalItems"></span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT AREA (PADDED BOTTOM UNTUK BOTTOM BAR MOBILE) -->
  <main class="flex-1 pb-24 pt-3 px-3 max-w-md mx-auto w-full">
    
    <!-- PAGE: HOME -->
    <div x-show="activePage === 'home'" x-cloak class="space-y-5">
      <!-- Banner Mobile -->
      <section class="bg-gradient-to-br from-brand-950 via-brand-900 to-brand-800 text-white rounded-3xl p-5 text-center space-y-3 shadow-lg relative overflow-hidden">
        <img src="images/velaro-coffe.png" class="w-16 h-16 mx-auto object-contain drop-shadow-md">
        <h2 class="text-xl font-black leading-tight">Nikmati Kopi Favoritmu Tanpa Antre</h2>
        <p class="text-stone-300 text-[11px] leading-relaxed">Pesan langsung dari meja Anda, cepat & praktis.</p>
        <button @click="activePage = 'menu'" class="w-full py-3 bg-brand-500 hover:bg-brand-600 active:scale-95 transition text-white font-bold rounded-2xl text-xs shadow-md">Pesan Sekarang</button>
      </section>

      <!-- Popular Menu Mobile -->
      <section class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h3 class="text-sm font-bold text-stone-900">Menu Populer</h3>
          <button @click="activePage = 'menu'" class="text-[11px] font-bold text-brand-600">Lihat Semua</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <template x-for="p in products" :key="p.id">
            <div @click="addToCart(p)" class="bg-white border border-stone-200 rounded-2xl p-2.5 flex flex-col justify-between active:scale-95 transition shadow-sm">
              <div>
                <img :src="p.image" class="w-full h-24 object-cover rounded-xl mb-2">
                <h4 class="font-bold text-xs text-stone-900 line-clamp-1" x-text="p.name"></h4>
                <p class="text-[9px] text-stone-400 font-medium" x-text="p.category"></p>
              </div>
              <div class="flex justify-between items-center mt-2 pt-1 border-t border-stone-100">
                <span class="text-xs font-black text-brand-700" x-text="formatRupiah(p.price)"></span>
                <span class="w-6 h-6 rounded-lg bg-brand-100 text-brand-700 flex items-center justify-center font-bold text-xs">+</span>
              </div>
            </div>
          </template>
        </div>
      </section>
    </div>

    <!-- PAGE: MENU -->
    <div x-show="activePage === 'menu'" x-cloak class="space-y-4">
      <h3 class="text-sm font-bold px-1 text-stone-900">Katalog Menu</h3>
      <div class="grid grid-cols-2 gap-3">
        <template x-for="p in products" :key="p.id">
          <div @click="addToCart(p)" class="bg-white border border-stone-200 rounded-2xl p-2.5 flex flex-col justify-between active:scale-95 transition shadow-sm">
            <div>
              <img :src="p.image" class="w-full h-24 object-cover rounded-xl mb-2">
              <h4 class="font-bold text-xs text-stone-900 line-clamp-1" x-text="p.name"></h4>
              <p class="text-[9px] text-stone-400 font-medium" x-text="p.category"></p>
            </div>
            <div class="flex justify-between items-center mt-2 pt-1 border-t border-stone-100">
              <span class="text-xs font-black text-brand-700" x-text="formatRupiah(p.price)"></span>
              <button class="px-2 py-1 bg-brand-600 text-white rounded-lg text-[10px] font-bold">+ Tambah</button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- PAGE: CART -->
    <div x-show="activePage === 'cart'" x-cloak class="space-y-4">
      <h3 class="text-sm font-bold px-1 text-stone-900">Keranjang Pesanan</h3>
      
      <template x-if="cart.length === 0">
        <div class="text-center py-12 bg-white rounded-3xl border border-stone-200 p-6 space-y-3 shadow-sm">
          <div class="w-12 h-12 rounded-full bg-stone-100 text-stone-400 flex items-center justify-center mx-auto">
            <i data-lucide="shopping-bag" class="w-6 h-6"></i>
          </div>
          <p class="text-xs text-stone-500 font-medium">Keranjang kamu masih kosong.</p>
          <button @click="activePage = 'menu'" class="px-5 py-2 bg-brand-600 text-white font-bold rounded-xl text-xs">Pilih Menu</button>
        </div>
      </template>

      <template x-if="cart.length > 0">
        <div class="space-y-3">
          <!-- Input Nama Pemesan Mobile Friendly -->
          <div class="bg-white border border-stone-200 rounded-2xl p-3.5 space-y-1.5 shadow-sm">
            <label class="block text-xs font-bold text-stone-700">Nama Pemesan <span class="text-red-500">*</span></label>
            <input type="text" x-model="customerName" placeholder="Masukkan nama panggilanmu" class="w-full px-3 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-brand-500">
            <p class="text-[9px] text-stone-400">Nama ini akan dipanggil oleh kasir saat pesanan siap.</p>
          </div>

          <!-- Items Cart -->
          <div class="space-y-2">
            <template x-for="(item, idx) in cart" :key="idx">
              <div class="bg-white border border-stone-200 rounded-2xl p-3 flex justify-between items-center shadow-sm">
                <div>
                  <h4 class="font-bold text-xs text-stone-900" x-text="item.name"></h4>
                  <p class="text-[11px] text-brand-700 font-bold mt-0.5" x-text="formatRupiah(item.price)"></p>
                </div>
                <div class="flex items-center space-x-2 bg-stone-100 p-1 rounded-xl">
                  <button @click="updateQty(idx, -1)" class="w-6 h-6 bg-white rounded-lg font-bold text-xs shadow-sm flex items-center justify-center">-</button>
                  <span class="text-xs font-bold w-4 text-center" x-text="item.qty"></span>
                  <button @click="updateQty(idx, 1)" class="w-6 h-6 bg-white rounded-lg font-bold text-xs shadow-sm flex items-center justify-center">+</button>
                </div>
              </div>
            </template>
          </div>

          <!-- Summary & Order Button -->
          <div class="bg-white border border-stone-200 rounded-2xl p-4 space-y-3 shadow-sm">
            <div class="flex justify-between text-xs font-bold text-stone-800">
              <span>Total Biaya</span>
              <span class="text-brand-700 text-sm font-black" x-text="formatRupiah(cartSubtotal)"></span>
            </div>
            <button @click="checkout()" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 active:scale-95 transition text-white font-bold rounded-xl text-xs shadow-md">
              Kirim Pesanan ke Kasir
            </button>
          </div>
        </div>
      </template>
    </div>

    <!-- PAGE: ORDERS (REALTIME TRACKING) -->
    <div x-show="activePage === 'orders'" x-cloak class="space-y-3">
      <h3 class="text-sm font-bold px-1 text-stone-900">Status Pesanan Saya</h3>
      
      <template x-if="customerOrders.length === 0">
        <div class="text-center py-10 bg-white rounded-2xl border border-stone-200 p-4">
          <p class="text-xs text-stone-400">Belum ada riwayat pesanan.</p>
        </div>
      </template>

      <template x-for="order in customerOrders" :key="order.id">
        <div class="bg-white border border-stone-200 rounded-2xl p-4 space-y-3 shadow-sm">
          <div class="flex justify-between items-start border-b border-stone-100 pb-2.5">
            <div>
              <p class="text-xs font-bold text-stone-900" x-text="order.id"></p>
              <p class="text-[10px] font-semibold text-brand-700" x-text="'Pemesan: ' + order.customerName"></p>
              <p class="text-[9px] text-stone-400" x-text="new Date(order.date).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'})"></p>
            </div>
            <span class="px-2.5 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-full text-[9px] font-extrabold uppercase tracking-wide" x-text="order.status"></span>
          </div>

          <div class="text-xs space-y-1">
            <template x-for="i in order.items" :key="i.name">
              <div class="flex justify-between text-stone-600 text-[11px]">
                <span x-text="i.qty + 'x ' + i.name"></span>
                <span class="font-medium" x-text="formatRupiah(i.price * i.qty)"></span>
              </div>
            </template>
          </div>

          <div class="border-t border-stone-100 pt-2 flex justify-between font-bold text-xs">
            <span class="text-stone-500">Total</span>
            <span class="text-brand-700" x-text="formatRupiah(order.total)"></span>
          </div>
        </div>
      </template>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR (FIXED NAV KHUSUS MOBILE) -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-stone-200 px-6 py-2 flex justify-around items-center text-[10px] font-bold text-stone-400 z-50">
    <button @click="activePage = 'home'" :class="activePage === 'home' ? 'text-brand-600' : 'text-stone-400'" class="flex flex-col items-center space-y-1 py-1">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span>Home</span>
    </button>
    <button @click="activePage = 'menu'" :class="activePage === 'menu' ? 'text-brand-600' : 'text-stone-400'" class="flex flex-col items-center space-y-1 py-1">
      <i data-lucide="coffee" class="w-5 h-5"></i>
      <span>Menu</span>
    </button>
    <button @click="activePage = 'cart'" :class="activePage === 'cart' ? 'text-brand-600' : 'text-stone-400'" class="flex flex-col items-center space-y-1 py-1 relative">
      <i data-lucide="shopping-bag" class="w-5 h-5"></i>
      <span>Keranjang</span>
      <span x-show="cartTotalItems > 0" class="absolute -top-1 right-2 bg-brand-600 text-white text-[8px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" x-text="cartTotalItems"></span>
    </button>
    <button @click="activePage = 'orders'" :class="activePage === 'orders' ? 'text-brand-600' : 'text-stone-400'" class="flex flex-col items-center space-y-1 py-1">
      <i data-lucide="receipt" class="w-5 h-5"></i>
      <span>Pesanan</span>
    </button>
  </nav>

  <script>
    function customerApp() {
      return {
        activePage: 'home',
        customerName: '',
        cart: [],
        customerOrders: [],
        products: [
          { id: 1, name: 'Espresso', price: 18000, category: 'Coffee', image: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=400' },
          { id: 2, name: 'Americano', price: 20000, category: 'Coffee', image: 'https://images.unsplash.com/photo-1551030173-122aabc4489c?w=400' },
          { id: 3, name: 'Cappuccino', price: 25000, category: 'Coffee', image: 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=400' },
          { id: 4, name: 'Cafe Latte', price: 25000, category: 'Coffee', image: 'https://images.unsplash.com/photo-1534778101976-62847782c213?w=400' }
        ],

        initApp() {
          this.loadOrders();
          window.addEventListener('storage', (e) => {
            if (e.key === 'velaro_shared_orders') {
              this.loadOrders();
            }
          });
          this.$nextTick(() => lucide.createIcons());
        },

        loadOrders() {
          this.customerOrders = JSON.parse(localStorage.getItem('velaro_shared_orders')) || [];
        },

        get cartTotalItems() { return this.cart.reduce((s, i) => s + i.qty, 0); },
        get cartSubtotal() { return this.cart.reduce((s, i) => s + (i.price * i.qty), 0); },

        addToCart(product) {
          const item = this.cart.find(i => i.id === product.id);
          if (item) item.qty++;
          else this.cart.push({ ...product, qty: 1 });
          alert('Berhasil ditambah ke keranjang!');
        },

        updateQty(idx, delta) {
          this.cart[idx].qty += delta;
          if (this.cart[idx].qty <= 0) this.cart.splice(idx, 1);
        },

        checkout() {
          if (!this.customerName.trim()) {
            alert('Harap isi Nama Pemesan terlebih dahulu!');
            return;
          }

          const newOrder = {
            id: 'VC-' + Date.now().toString().slice(-5),
            customerName: this.customerName,
            items: [...this.cart],
            total: this.cartSubtotal,
            status: 'Pesanan Diterima',
            date: new Date()
          };

          let allOrders = JSON.parse(localStorage.getItem('velaro_shared_orders')) || [];
          allOrders.unshift(newOrder);
          localStorage.setItem('velaro_shared_orders', JSON.stringify(allOrders));

          this.cart = [];
          this.customerOrders = allOrders;
          this.activePage = 'orders';
          alert(`Pesanan atas nama ${this.customerName} berhasil dikirim ke kasir!`);
        },

        formatRupiah(val) {
          return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
        }
      }
    }
  </script>
</body>
</html>
